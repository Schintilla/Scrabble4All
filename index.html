<script>

  $("np").onchange=mk;mk();$("lv").value=level;

function ready(){

function msg(t){note=t;render()}
const LBL={T:"TRIPLE WORD SCORE",D:"DOUBLE WORD SCORE",t:"TRIPLE LETTER SCORE",d:"DOUBLE LETTER SCORE","*":"★"};

    const d=document.createElement("div"),p=PREM[r][c];d.className="cell "+(p=="*"?"D":p);

  }

  const oldScroll=[...document.querySelectorAll("#scores .col")].map(e=>e.scrollTop);$("scores").innerHTML=players.map(p=>`<div class="col"><div class="hd"><span>${esc(p.name)}</span><span>${p.score}</span></div>${p.moves.map(m=>`<div class="mg">${(()=>{let c=0;return m.map(l=>{c+=+l.s||0;return `<div class="mv${l.k?" w":""}${l.k&&l.w===selWord?" sel":""}"${l.k?` data-w="${l.w}"`:""}><span>${esc(l.w)}</span><span>${l.s}</span><span>${l.s===""?"":c}</span></div>`}).join("")})()}</div>`).join("")}</div>`).join("");
  $("status").textContent=note||(over?"Game over":`${players[cur].name}, play a word`);
  const mc=players.map(p=>p.moves.length).join();document.querySelectorAll("#scores .col").forEach((e,i)=>e.scrollTop=(mc!==lastMC?e.scrollHeight:(oldScroll[i]||0)));lastMC=mc;
  updLabels();{const nm=$("sndmark");if(nm)nm.textContent=soundOn?"✓ ":" "}$("rej").style.display=players.some(p=>p.cpu)?"":"none";$("rej").disabled=!(snap&&humanTurn()&&!pend.length&&!swapMode);$("play").disabled=!(humanTurn()&&pend.length>0);$("swapsel").textContent=swapMode?(swapSel.size?`Swap ${swapSel.size} tile${swapSel.size>1?"s":""}`:"Cancel swap"):"Swap tiles";["easy","medium","hard"].forEach(k=>{const e=$("lv_"+k);if(e)e.textContent=level===k?"✓ ":"\u2003"});const cm=$("chkmark"),dc=$("dcount");if(cm)cm.textContent=$("chk").checked?"✓ ":"\u2003";if(dc)dc.textContent=dict.size.toLocaleString()+" words loaded"+(dChanged?" (modified)":"");
}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function tileHTML(t,cls){return `<div class="tile ${cls} ${t.blank?"blank":""}">${t.ch=="?"?"":t.ch}${t.blank||t.ch=="?"?"":`<sub>${t.pts}</sub>`}</div>`}
async function cellClick(r,c){
  if(askingLetter||dragMoved||over||busy||swapMode||players[cur].cpu)return;
  const i=pend.findIndex(x=>x.r==r&&x.c==c);
  if(i>=0){const t=pend[i].t;pend.splice(i,1);if(t.orig){t.ch="?";t.blank=false}sfx("slide");render();return}

    askingLetter=true;const l=(await askLetter())||"";askingLetter=false;

function wordAt(r,c,dr,dc){
  const at=(a,b)=>board[a]&&board[a][b]?{t:board[a][b],n:0}:(x=>x?{t:x.t,n:1}:null)(pend.find(p=>p.r==a&&p.c==b));

function evalMove(){

  else{const cc=pend[0].c,lo=Math.min(...pend.map(p=>p.r)),hi=Math.max(...pend.map(p=>p.r));
    for(let r=lo;r<=hi;r++)if(!board[r][cc]&&!pend.some(p=>p.r==r))return{err:"There are gaps between your tiles."}}

$("pass").onclick=()=>{

$("swap").onclick=()=>{

function parse(txt){const set=new Set();for(let w of txt.split(/\s+/)){w=w.split("/")[0].toLowerCase();if(/^[a-z]{2,15}$/.test(w))set.add(w)}return [...set]}

  else{const i=document.createElement("input");i.type="file";i.accept=".txt,.dic,.lst";i.onchange=async()=>res(i.files[0]?await i.files[0].text():null);i.click()}})}
async function boot(){

    await new Promise(res=>{
      $("cover").innerHTML=dlg("Scrabble4All — dictionary",`<p>The default dictionary file (scrabble4all-default-dictionary.txt) could not be loaded.</p><p style="font-size:12px">This happens when the page is opened straight from disk. Choose the file, or open the page from a web server.</p><p><button class="b95" id="dl">Choose file…</button></p>`);

function popup(t,html,side){
  if(letterResolve){const r=letterResolve;letterResolve=null;r(null)}
  const p=$("pop");p.style.display="block";p.innerHTML=`<div class="tb" style="cursor:move"><span>${t}</span></div><div class="bd">${html}</div>`;
  p.style.transform="translateX(-50%)";p.style.top="12%";p.style.left="50%";p.style.width="";
  if(side){const r=$("right").getBoundingClientRect();p.style.width=Math.max(260,r.width-16)+"px";p.style.left=(r.left+r.width/2)+"px";p.style.top=(r.top+40)+"px"}
  const tb=p.firstChild;
  tb.onpointerdown=e=>{
    const r=p.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;p.style.transform="none";p.style.left=r.left+"px";p.style.top=r.top+"px";
    const mv=ev=>{p.style.left=Math.max(0,ev.clientX-dx)+"px";p.style.top=Math.max(0,ev.clientY-dy)+"px"},up=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up)};

async function lookup(w){
  if(!w){askWord("Look up meaning","Type a word (or double-click a word in a score list):","Look up",v=>lookup(clean(v)));return}
  const my=++lkId,ew=esc(w),title=`Meaning — ${ew}`,
    link=`<a href="https://en.wiktionary.org/wiki/${encodeURIComponent(w)}" target="_blank" rel="noopener">Look it up on Wiktionary</a>`,
    show=(h,retry)=>{if(my!==lkId)return;popup(title,h+`<p style="text-align:center">${retry?'<button class="b95" id="pr">Try again</button> ':""}<button class="b95" id="pc">Close</button></p>`);$("pc").onclick=closePop;if(retry)$("pr").onclick=()=>lookup(w)};
  popup(title,`<p>Looking up “${ew}”…</p>`);
  if(typeof navigator!=="undefined"&&navigator.onLine===false)return show(`<p><b>No internet connection.</b> Check your connection, then try again.</p>`,true);
  const API="https://api.dictionaryapi.dev/api/v2/entries/en/",ac=new AbortController(),tm=setTimeout(()=>ac.abort(),10000),
    tries=[...new Set([w,w.replace(/ies$/,"y"),w.replace(/(es|s)$/,""),w.replace(/ed$/,""),w.replace(/d$/,""),w.replace(/ing$/,""),w.replace(/ing$/,"e")])].filter(x=>x.length>1);
  let data=null,used=w,fail=null;
  try{
    for(const t of tries){
      let r;
      try{r=await fetch(API+encodeURIComponent(t),{signal:ac.signal})}
      catch(e){
        if(ac.signal.aborted)throw e;
        // either the network is down, or the service answered "not found" without browser-readable headers: probe to tell which
        let up=true;
        try{await fetch("https://api.dictionaryapi.dev/",{mode:"no-cors",signal:ac.signal,cache:"no-store"})}catch(e2){if(ac.signal.aborted)throw e2;up=false}
        if(!up){fail="net";break}
        continue;
      }
      if(r.ok){data=await r.json();used=t;break}
      if(r.status!==404){fail="err:"+r.status;break}
    }
  }catch(e){fail=ac.signal.aborted?"timeout":"err:"}
  clearTimeout(tm);
  if(my!==lkId)return;
  if(fail==="net")return show(`<p><b>No connection.</b> Couldn't reach the online dictionary. Check your internet connection, then try again.</p>`,true);
  if(fail==="timeout")return show(`<p><b>Timed out.</b> The online dictionary didn't respond in time.</p><p>${link}</p>`,true);
  if(fail)return show(`<p><b>Dictionary service error</b>${fail.length>4?" ("+esc(fail.slice(4))+")":""}. Try again in a moment.</p><p>${link}</p>`,true);
  if(!data)return show(`<p><b>No definition found</b> for “${ew}”. It may be a valid word that the online dictionary doesn't cover.</p><p>${link}</p>`,false);
  let h=used!==w?`<p><i>Showing “${esc(used)}”, a base form of “${ew}”.</i></p>`:"";

    h+=`<p><b>${esc(m.partOfSpeech||"")}</b></p><ol>${m.definitions.slice(0,3).map(d=>`<li>${esc(d.definition)}${d.example?`<div class="ex">“${esc(d.example)}”</div>`:""}</li>`).join("")}</ol>`;
  show(h+`<p>${link}</p>`,false);
}
